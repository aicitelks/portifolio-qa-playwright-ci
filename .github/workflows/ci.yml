name: Playwright E2E Tests

# Define QUANDO o CI será executado
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  testes-e2e:
    # Máquina virtual onde o teste vai rodar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Baixa o código do repositório para a máquina virtual
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Instala a versão mais estável do ambiente Node.js.
      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Instala as dependências do projeto (npm install)
      - name: Instalar Dependências
        run: npm ci

      # 4. Instala os navegadores do Playwright
      - name: Instalar Navegadores do Playwright
        run: npx playwright install --with-deps

      # 5. Executa os testes em modo headless (sem interface gráfica)
      - name: Executar Testes Automatizados
        run: npx playwright test

      # 6. Publica o relatório HTML dos testes como artefato do GitHub
      - name: Salvar Relatório de Testes
        uses: actions/upload-artifact@v4
        # Condição para não salvar o relatório se o job for cancelado manualmente
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
